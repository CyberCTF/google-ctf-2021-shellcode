# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# abc arm and amd (Google's 2021 security competition, by Google; a misc challenge) as an Isoloom spec:
# write one printable payload of at most 280 bytes that prints the flag on both x86-64 and arm64.
# The challenge folder 2021/quals/misc-shellcode of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2021-shellcode

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.192.0/24, internet: false}

machines:
  challenge:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    volumes: {ctf: /chroot/home/user}     # the flag, written by ctf/flag.sh at every start
    ports:
      challenge:
        port: 1337
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the runner asks for the payload
    script: checks/probe.sh
    wait: 60

message: |
  abc arm and amd (Google, 2021) answers at `nc localhost {{ machines.challenge.ports.challenge.published }}`.
  Find instructions that decode harmlessly on one architecture and branch on the other.
